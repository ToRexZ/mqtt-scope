name: Website

# Publishes site/ (plus the README screenshots and the app icon) to GitHub
# Pages: https://torexz.github.io/mqtt-scope/

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/screenshots/**', 'build/icon.svg', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/screenshots
          cp -r site/. _site/
          cp docs/screenshots/*.png _site/screenshots/
          cp build/icon.svg _site/icon.svg
      - name: WebP versions of the screenshots (served with PNG fallback)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends webp >/dev/null
          for f in _site/screenshots/*.png; do cwebp -quiet -q 82 "$f" -o "${f%.png}.webp"; done
          sed -i "s/__LASTMOD__/$(date -u +%Y-%m-%d)/" _site/sitemap.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
